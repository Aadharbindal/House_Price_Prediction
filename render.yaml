# Render.com Web Service Specification
# Deploys Node.js Express server + Python environment for ML models

services:
  - type: web
    name: house-price-prediction
    env: node
    plan: free
    rootDir: backend
    # Installs the pinned versions rather than resolving them fresh. model.joblib
    # is a pickle, and a pickle only reloads reliably on the library versions it
    # was written with - scikit-learn 1.5.0 and numpy 1.x here. Left unpinned,
    # pip would pull numpy 2.x, whose internals moved, and prediction would
    # break on the host while still working locally.
    buildCommand: |
      npm install && pip install -r ../ml/requirements.txt
    startCommand: |
      node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PYTHON_CMD
        value: python3

